version: '3.9'

services:
  # ─── Banco de Dados ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ehr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ehr_fleet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ehr_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ehr_fleet
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ehr_secret_mude_em_producao_2024
      JWT_EXPIRES_IN: 8h
    ports:
      - '3001:3001'

  # ─── Frontend React ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ehr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres_data:
